<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS VAULT | Operational Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; transition: 0.3s; }
        .glass-card:hover { border-color: rgba(6, 182, 212, 0.5); }
        .terminal { background: #000; color: #00ff41; font-family: 'Space Mono', monospace; padding: 15px; border-radius: 10px; height: 220px; overflow-y: auto; font-size: 13px; border: 1px solid #334155; box-shadow: inset 0 0 10px #000; }
        .form-control { background: #020617; border: 1px solid #334155; color: white; margin-bottom: 10px; }
        .form-control:focus { background: #020617; color: white; border-color: #06b6d4; box-shadow: 0 0 0 0.25rem rgba(6, 182, 212, 0.25); }
        .btn-cyan { background: #06b6d4; color: white; font-weight: bold; width: 100%; border-radius: 8px; border: none; padding: 10px; }
        .btn-cyan:hover { background: #0891b2; transform: translateY(-2px); }
        .progress { height: 8px; background: #1e293b; margin-bottom: 15px; border-radius: 10px; }
        .progress-bar { transition: width 0.8s ease; }
        .status-label { font-size: 0.75rem; font-weight: bold; color: #94a3b8; letter-spacing: 1px; }
        hr { border-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <h1 class="fw-bold"><i class="fas fa-shield-halved text-info me-2"></i>OPERATIONAL TERMINAL</h1>
                <p class="text-secondary mb-0">Stateless AES-256-GCM Environment • v2.5 Production Build</p>
            </div>
            <div class="col-md-5">
                <div class="glass-card py-3">
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="d-flex justify-content-between status-label"><span>CPU LOAD</span><span id="cpu-val">0%</span></div>
                            <div class="progress"><div id="cpu-bar" class="progress-bar bg-info" style="width: 0%"></div></div>
                        </div>
                        <div class="col-6">
                            <div class="d-flex justify-content-between status-label"><span>RAM USAGE</span><span id="ram-val">0%</span></div>
                            <div class="progress"><div id="ram-bar" class="progress-bar bg-warning" style="width: 0%"></div></div>
                        </div>
                    </div>
                    <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between">
                        <button onclick="clearCache()" class="btn btn-sm btn-outline-danger px-3">
                            <i class="fas fa-broom me-1"></i> PURGE RAM
                        </button>
                        <a href="/api/download_audit" class="btn btn-sm btn-outline-info px-3 text-decoration-none">
                            <i class="fas fa-file-download me-1"></i> SECURITY LOGS
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-card h-100">
                <h5 class="text-info mb-4"><i class="fas fa-microchip me-2"></i> Local Crypto-Engine</h5>
                <form id="encryptForm">
                    <label class="small text-secondary mb-1">Upload Original File</label>
                    <input type="file" name="file" class="form-control" required>
                    <input type="password" name="password" class="form-control" placeholder="Set Master Vault Key" required>
                    <button type="submit" id="encrypt-btn" class="btn btn-cyan">EXECUTE ENCRYPTION</button>
                </form>
                <hr class="my-4">
                <form id="decryptForm">
                    <label class="small text-secondary mb-1">Upload .aegis File</label>
                    <input type="file" name="file" class="form-control" required>
                    <input type="password" name="password" class="form-control" placeholder="Enter Vault Key" required>
                    <button type="submit" class="btn btn-outline-warning w-100">VERIFY & DECRYPT</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <div class="glass-card h-100">
                <h5 class="text-primary mb-4"><i class="fas fa-satellite-dish me-2"></i> IPFS Broadcast & Burn</h5>
                <form id="cloudEncryptForm">
                    <input type="file" name="file" class="form-control" required>
                    <input type="password" name="password" class="form-control" placeholder="Set Vault Key" required>
                    <button type="submit" class="btn btn-primary w-100">ENCRYPT & BROADCAST</button>
                </form>
                
                <div id="cidResult" class="mt-3 d-none p-3 bg-dark rounded border border-success">
                    <small class="text-success fw-bold"><i class="fas fa-check-circle me-1"></i> BROADCAST SUCCESSFUL</small>
                    <div class="d-flex align-items-center mt-1">
                        <div id="cidValue" class="text-break small font-monospace text-white flex-grow-1"></div>
                        <button class="btn btn-sm btn-outline-light ms-2" onclick="copyCID()"><i class="far fa-copy"></i></button>
                    </div>
                </div>

                <hr class="my-4">
                <form id="cloudFetchForm">
                    <input type="text" name="cid" class="form-control" placeholder="Enter IPFS CID (Qm...)" required>
                    <input type="password" name="password" class="form-control" placeholder="Vault Key" required>
                    <button type="submit" class="btn btn-danger w-100">RECOVER & DESTROY (AUTO-BURN)</button>
                </form>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-12">
            <div id="terminal" class="terminal">> Aegis Engine v2.5 Online... Initializing stateless buffers...</div>
        </div>
    </div>
</div>

<script>
    // --- 1. LIVE TELEMETRY & AUTO-ALERT ---
    async function updateTelemetry() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            document.getElementById('cpu-val').innerText = data.cpu + '%';
            document.getElementById('cpu-bar').style.width = data.cpu + '%';
            document.getElementById('ram-val').innerText = data.ram + '%';
            document.getElementById('ram-bar').style.width = data.ram + '%';

            const ramBar = document.getElementById('ram-bar');
            if (data.ram > 85) {
                ramBar.classList.replace('bg-warning', 'bg-danger');
                log("CRITICAL: RAM usage exceeding safety limits!", "#ff4444");
            } else if (data.ram > 70) {
                ramBar.classList.add('bg-warning');
                log("WARNING: System memory overhead high.", "#fbbf24");
            } else {
                ramBar.classList.remove('bg-danger');
            }
        } catch (err) { console.error("Telemetry link severed."); }
    }
    setInterval(updateTelemetry, 3000);

    // --- MANUAL CACHE PURGE FUNCTION ---
    async function clearCache() {
        log("MANUAL PURGE: Releasing stateless buffers...");
        try {
            const res = await fetch('/api/clear_cache', { method: 'POST' });
            const data = await res.json();
            log(`PURGE SUCCESS: Dropped RAM from ${data.memory_before}% to ${data.memory_after}%`, "#06b6d4");
            updateTelemetry(); 
        } catch (err) {
            log("PURGE FAILED: Buffer busy.", "#ff4444");
        }
    }

    // --- 2. TERMINAL LOGGER ---
    function log(msg, color="#00ff41") {
        const t = document.getElementById('terminal');
        const time = new Date().toLocaleTimeString([], { hour12: false });
        t.innerHTML += `<div><span style="color:#64748b">[${time}]</span> <span style="color:${color}">> ${msg}</span></div>`;
        t.scrollTop = t.scrollHeight;
    }

    // --- 3. UTILITIES ---
    function copyCID() {
        const cid = document.getElementById('cidValue').innerText;
        navigator.clipboard.writeText(cid);
        log("CID copied to clipboard.");
    }

    // --- 4. CORE REQUEST HANDLER (RELATIVE PATHS) ---
    async function handle(e, url) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerText;
        
        log(`Initiating operation at ${url}...`);
        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        const formData = new FormData(e.target);
        try {
            const res = await fetch(url, { method: 'POST', body: formData });
            
            if (res.ok) {
                const contentType = res.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await res.json();
                    if(data.cid) {
                        document.getElementById('cidResult').classList.remove('d-none');
                        document.getElementById('cidValue').innerText = data.cid;
                        log(`Network confirmation received. CID: ${data.cid}`);
                    }
                } else {
                    const blob = await res.blob();
                    const link = document.createElement('a');
                    link.href = window.URL.createObjectURL(blob);
                    link.download = "aegis_output_" + Date.now();
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    log("Integrity verified. File transmission complete.");
                }
            } else {
                const err = await res.json();
                log(`SECURITY ERROR: ${err.error}`, "#ff4444");
            }
        } catch (err) { 
            log("SYSTEM ERROR: Failed to reach engine.", "#ff4444"); 
        } finally {
            btn.disabled = false;
            btn.innerText = originalText;
        }
    }

    document.getElementById('encryptForm').onsubmit = (e) => handle(e, '/api/encrypt');
    document.getElementById('decryptForm').onsubmit = (e) => handle(e, '/api/decrypt');
    document.getElementById('cloudEncryptForm').onsubmit = (e) => handle(e, '/api/encrypt_cloud');
    document.getElementById('cloudFetchForm').onsubmit = (e) => handle(e, '/api/decrypt_cid');
</script>
</body>
</html>
